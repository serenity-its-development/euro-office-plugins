<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>OneOS files</title>
		<!-- The plugin SDK is vendored (Apache-2.0, see ../NOTICE): nothing is loaded from elsewhere. -->
		<script type="text/javascript" src="vendor/plugins.js"></script>
		<link rel="stylesheet" href="styles/oneos-files.css">
		<script type="text/javascript" src="scripts/bridge.js"></script>
		<script type="text/javascript" src="scripts/oneos-files.js"></script>
	</head>
	<body>
		<div class="of">
			<form class="of__search" id="of-search" autocomplete="off">
				<input class="of__input" id="of-query" type="search" placeholder="Search your files" aria-label="Search your files" maxlength="200" spellcheck="false">
				<button class="of__btn" type="submit">Search</button>
			</form>
			<div class="of__crumbs" id="of-crumbs"></div>
			<div class="of__status" id="of-status" role="status" aria-live="polite"></div>
			<ul class="of__list" id="of-list" aria-label="Your files"></ul>
		</div>
	</body>
</html>
